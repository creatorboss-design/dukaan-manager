name: Build & Release Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
          with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Build desktop installers
      - name: Make Installers
        run: npm run make

      # ---- Android build (Linux runner only) ----

      - name: Setup Java (for Android)
          if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
          with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle
          if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
          with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Android SDK
          if: matrix.os == 'ubuntu-latest'
        uses: android-actions/setup-android@v4
          with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Build Android APK
          if: matrix.os == 'ubuntu-latest'
        run: |
          node -v
          java -version
          npm run build:android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
          mv app/build/outputs/apk/release/app-release.apk ../dukaan-manager.apk

      # ---- Upload release files ----

        - name: Upload Windows installer
          if: matrix.os == 'windows-latest'
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            files: |
              out/make/**/*.exe
              out/make/**/*.nupkg
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        - name: Upload Linux packages
          if: matrix.os == 'ubuntu-latest'
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            files: |
              out/make/**/*.deb
              out/make/**/*.zip
              dukaan-manager.apk
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
